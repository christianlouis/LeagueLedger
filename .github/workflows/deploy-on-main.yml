name: Manual LeagueLedger Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'christianlouis/LeagueLedger'
    runs-on: ubuntu-latest
    steps:
      - name: Require deployment webhook configuration
        env:
          DEPLOY_WEBHOOK: ${{ secrets.LEAGUELEDGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "::error::Missing LEAGUELEDGER_DEPLOY_WEBHOOK repository secret; deployment was not attempted."
            exit 1
          fi

      - name: Trigger configured deploy webhook
        env:
          DEPLOY_WEBHOOK: ${{ secrets.LEAGUELEDGER_DEPLOY_WEBHOOK }}
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_WEBHOOK"
